# Este es mi pipeline de DevSecOps para la tarea final curso DevSecOps
# Incluye SAST, SCA, Docker build y Trivy scan

name: DevSecOps Pipeline

# Cuando se ejecuta: cada push o pull request a cualquier rama
on:
  push:
    branches:
      - '**'   # cualquier rama
  pull_request:
    branches:
      - '**'   # cualquier PR

jobs:

  # --------------------------
  # Job 1: SAST con SonarCloud
  # --------------------------
  sast:
    name: SAST - SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # >>> Cambio hecho por mi: antes no había Java 17, el workflow fallaba
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'      # esto arregla el error de versión de Java
          distribution: 'temurin'

      - name: Run SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v1
        with:
          args: >
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.qualitygate.wait=true

  # --------------------------
  # Job 2: SCA (analiza dependencias)
  # --------------------------
  sca:
    name: SCA - Dependency Check
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Dependency Check
        uses: dependency-check/scan-action@v2
        with:
          project: devsecops-laboratorio
          scan: .
          format: 'ALL'
          failOnCVSS: 7   # falla si hay vulnerabilidades altas o críticas

  # --------------------------
  # Job 3: Build Docker image
  # --------------------------
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image (local)
        uses: docker/build-push-action@v4
        with:
          context: .                     # raíz del repo, donde esta Dockerfile
          push: false
          tags: local-image:dev-$GITHUB_RUN_ID
      - name: Save image reference
        run: echo "IMAGE_REF=local-image:dev-$GITHUB_RUN_ID" >> $GITHUB_ENV

  # --------------------------
  # Job 4: Scan Docker image con Trivy
  # --------------------------
  image-scan:
    name: Image scan - Trivy
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scan-type: image
          format: 'table'
          exit-code: '1'                   # si hay vulnerabilidades, falla el pipeline
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          output: 'trivy-report.txt'
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
