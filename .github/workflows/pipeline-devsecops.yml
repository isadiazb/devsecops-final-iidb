# Pipeline DevSecOps - tarea final curso DevSecOps
# Incluye: SAST con CodeQL, SCA, Docker build y Trivy scan

name: DevSecOps Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:

  # --------------------------
  # Job 0: Check SONAR_TOKEN
  # --------------------------
  check-secret:
    name: Check SONAR_TOKEN
    runs-on: ubuntu-latest
    steps:
      - name: Verificar si existe SONAR_TOKEN
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "Secret SONAR_TOKEN no encontrado"
            exit 1
          else
            echo "Secret SONAR_TOKEN OK"
          fi

  # --------------------------
  # Job 1: SAST CodeQL
  # --------------------------
  sast:
    name: Analisis SAST con CodeQL
    runs-on: ubuntu-latest
    needs: check-secret
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript

      - name: Ejecutar CodeQL
        uses: github/codeql-action/analyze@v2

    # --------------------------
  # Job 2: SCA (Dependency Check)
  # --------------------------
  # --------------------------
# Job 2: SCA (Dependency Check)
# --------------------------
  sca:
    name: SCA - Dependency Check
    runs-on: ubuntu-latest
    steps:
      # Primero traemos el código
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js porque algunos proyectos lo necesitan
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Instalamos dependencias de node
      - name: Install Node.js dependencies
        run: |
          npm ci
          if [ -f functions/package-lock.json ]; then
            cd functions && npm ci && cd ..
          fi

      # Instalamos dependency-check
      - name: Setup Dependency-Check
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-11-jdk
          mkdir -p $HOME/dependency-check
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v12.1.0/dependency-check-12.1.0-release.zip -O dependency-check.zip
          unzip -q dependency-check.zip -d $HOME/dependency-check
          rm dependency-check.zip

      # Cache de la base NVD para que no tenga que descargar todo cada vez
      - name: Cache Dependency-Check NVD Database
        uses: actions/cache@v3
        with:
          path: $HOME/.dependency-check
          key: dependency-check-nvd-db-${{ runner.os }}
          restore-keys: |
            dependency-check-nvd-db-${{ runner.os }}

      # Ejecutamos el scan principal
      - name: Run Dependency Check Scan
        run: |
          mkdir -p reports
          # Lo corremos con failOnCVSS 4 para que falle si hay vulnerabilidades medias, altas o criticas
          # Quitamos --noupdate porque si es la primera vez necesitamos que cree la DB
          # --disableOssIndex evita errores de limite de OSS Index
          $HOME/dependency-check/dependency-check/bin/dependency-check.sh \
            --scan . \
            --format ALL \
            --project "DevSecOps-Final-IIDB" \
            --out reports \
            --failOnCVSS 4 \
            --disableOssIndex

      # Subimos los reportes como artifact para poder verlos despues
      - name: Upload SCA reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: reports

# --------------------------
# Job 3: Build Docker image
# --------------------------
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    # needs: sca  # Se puede activar si quieres que espere a que SCA termine
    steps:
      # Primero traemos el código
      - name: Checkout code
        uses: actions/checkout@v4
        # Esto hace un "git clone" del repo para poder acceder a los archivos Dockerfile, etc.

      # Construimos la imagen Docker local
      - name: Build Docker image (local)
        uses: docker/build-push-action@v4
        with:
          context: .  # Contexto de build, normalmente la raíz del repo
          push: false # No queremos subir la imagen a Docker Hub, solo construir local
          # Corregimos el tag usando la variable correcta de GitHub Actions
          tags: local-image:dev-${{ github.run_id }}

      # Guardamos la referencia de la imagen en una variable de entorno
      - name: Save image reference
        run: |
          # Creamos una variable IMAGE_REF que vamos a usar en el scan con Trivy
          echo "IMAGE_REF=local-image:dev-${{ github.run_id }}" >> $GITHUB_ENV
          # $GITHUB_ENV es la forma correcta de pasar variables entre steps

  # --------------------------
  # Job 4: Scan Docker image con Trivy
  # --------------------------
  image-scan:
    name: Image scan - Trivy
    runs-on: ubuntu-latest
    # needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scan-type: image
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          output: 'trivy-report.txt'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
