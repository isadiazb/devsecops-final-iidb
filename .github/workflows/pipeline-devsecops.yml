# Pipeline DevSecOps - tarea final curso DevSecOps
# Incluye: SAST con SonarCloud, SCA, Docker build y Trivy scan

name: DevSecOps Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:

  # --------------------------
  # Job 0: Check SONAR_TOKEN
  # --------------------------
  check-secret:
    name: Check SONAR_TOKEN
    runs-on: ubuntu-latest
    steps:
      - name: Verificar si existe SONAR_TOKEN
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "Secret SONAR_TOKEN no encontrado"
            exit 1
          else
            echo "Secret SONAR_TOKEN OK"
          fi

  # --------------------------
  # Job 1: SAST SONAR
  # --------------------------
  sast:
    name: Analisis SAST con SonarCloud
    runs-on: ubuntu-latest
    needs: check-secret
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Importante para que SonarCloud vea todas las ramas y la principal

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Merge temporal a main
        run: |
          git fetch origin main
          git checkout main
          git merge --no-commit --no-ff $GITHUB_REF_NAME || true
          git status

      - name: Escaneo SonarCloud
        uses: sonarsource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=isadiazb
            -Dsonar.projectKey=isadiazb_devsecops-final-iidb
            -Dsonar.branch.name=feat-pipeline
            -Dsonar.qualitygate.wait=true


  # --------------------------
  # Job 2: SCA (Dependency Check)
  # --------------------------
  sca:
    name: SCA - Dependency Check
    runs-on: ubuntu-latest
    # needs: sast
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Node.js dependencies
        run: |
          npm ci
          if [ -f functions/package-lock.json ]; then
            cd functions && npm ci && cd ..
          fi

      - name: Setup Dependency-Check
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-11-jdk
          mkdir -p $HOME/dependency-check
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v12.1.0/dependency-check-12.1.0-release.zip -O dependency-check.zip
          unzip -q dependency-check.zip -d $HOME/dependency-check
          rm dependency-check.zip

      - name: Cache Dependency-Check NVD Database
        uses: actions/cache@v3
        with:
          path: $HOME/.dependency-check
          key: dependency-check-nvd-db-${{ runner.os }}
          restore-keys: |
            dependency-check-nvd-db-${{ runner.os }}

      - name: Ensure Dependency-Check DB exists
        run: |
          if [ ! -d "$HOME/.dependency-check/data" ]; then
            echo "Database not found, running first scan to initialize DB..."
            $HOME/dependency-check/dependency-check/bin/dependency-check.sh \
              --scan . \
              --out reports-init \
              --project "DevSecOps-Final-IIDB" \
              --format HTML \
              --failOnCVSS 0
          else
            echo "Database exists, skipping initialization"
          fi

      - name: Run Dependency Check Scan
        run: |
          mkdir -p reports
          $HOME/dependency-check/dependency-check/bin/dependency-check.sh \
            --scan . \
            --format ALL \
            --project "DevSecOps-Final-IIDB" \
            --out reports \
            --failOnCVSS 9 \
            --noupdate

      - name: Upload SCA reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: reports

  # --------------------------
  # Job 3: Build Docker image
  # --------------------------
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image (local)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: local-image:dev-$GITHUB_RUN_ID
      - name: Save image reference
        run: echo "IMAGE_REF=local-image:dev-$GITHUB_RUN_ID" >> $GITHUB_ENV

  # --------------------------
  # Job 4: Scan Docker image con Trivy
  # --------------------------
  image-scan:
    name: Image scan - Trivy
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scan-type: image
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          output: 'trivy-report.txt'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt