# Pipeline DevSecOps - tarea final curso DevSecOps
# Incluye: SAST con SonarCloud, SCA, Docker build y Trivy scan

name: DevSecOps Pipeline

# Se ejecuta en cualquier push o pull request
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:

  # --------------------------
  # Job 0: Check SONAR_TOKEN
  # --------------------------
  check-secret:
    name: Check SONAR_TOKEN
    runs-on: ubuntu-latest
    steps:
      - name: Verificar si existe SONAR_TOKEN
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "Secret SONAR_TOKEN no encontrado"
            exit 1
          else
            echo "Secret SONAR_TOKEN OK"
          fi

  # --------------------------
  # Job 1: SAST con SonarCloud
  # --------------------------
  sast:
    name: SAST - SonarCloud
    runs-on: ubuntu-latest
    needs: check-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk
        with:
          args: >
            -Dsonar.organization=isadiazb
            -Dsonar.projectKey=isadiazb_devsecops-final-iidb
            -Dsonar.qualitygate.wait=true

  # --------------------------
  # Job 2: SCA (Análisis de dependencias con OWASP Dependency-Check - sin API Key)
  # --------------------------
  sca:
    name: SCA - Dependency Check (Mirror OWASP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar OWASP Dependency-Check
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
          unzip dependency-check-9.0.9-release.zip -d $HOME/dependency-check
          export PATH=$HOME/dependency-check/dependency-check/bin:$PATH

      - name: Ejecutar análisis SCA con mirror OWASP
        run: |
          mkdir -p reports
          $HOME/dependency-check/dependency-check/bin/dependency-check.sh \
            --scan . \
            --format "HTML,XML,JSON" \
            --project "DevSecOps-Final-IIDB" \
            --out reports \
            --failOnCVSS 7 \
            --dataMirrorURL https://jeremylong.github.io/DependencyCheckData/mirror/ \
            --cveUrl12Modified https://jeremylong.github.io/DependencyCheckData/nvdcve-1.2-modified.json.gz \
            --cveUrl20Modified https://jeremylong.github.io/DependencyCheckData/nvdcve-2.0-modified.json.gz \
            --cveUrl20Base https://jeremylong.github.io/DependencyCheckData/nvdcve-2.0-%d.json.gz

      - name: Subir reporte de Dependency-Check
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  # --------------------------
  # Job 3: Build Docker image
  # --------------------------
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image (local)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: local-image:dev-$GITHUB_RUN_ID
      - name: Save image reference
        run: echo "IMAGE_REF=local-image:dev-$GITHUB_RUN_ID" >> $GITHUB_ENV

  # --------------------------
  # Job 4: Scan Docker image con Trivy
  # --------------------------
  image-scan:
    name: Image scan - Trivy
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scan-type: image
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          output: 'trivy-report.txt'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

