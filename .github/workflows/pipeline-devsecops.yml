# Pipeline DevSecOps - tarea final curso DevSecOps
# Incluye: SAST con CodeQL, SCA, Docker build y Trivy scan

name: DevSecOps Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:


  # --------------------------
  # Job 1: SAST CodeQL
  # --------------------------
  sast:
    name: Analisis SAST con CodeQL
    runs-on: ubuntu-latest
    # needs: check-secret
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript

      - name: Ejecutar CodeQL
        uses: github/codeql-action/analyze@v2


# --------------------------
# Job 2: SCA (Dependency Check)
# --------------------------
  sca:
    name: SCA - Dependency Check
    runs-on: ubuntu-latest
    steps:
      # Primero trae el código
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js porque algunos proyectos lo necesitan
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Instala dependencias de node
      - name: Install Node.js dependencies
        run: |
          npm ci
          if [ -f functions/package-lock.json ]; then
            cd functions && npm ci && cd ..
          fi

      # Instala dependency-check
      - name: Setup Dependency-Check
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-11-jdk
          mkdir -p $HOME/dependency-check
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v12.1.0/dependency-check-12.1.0-release.zip -O dependency-check.zip
          unzip -q dependency-check.zip -d $HOME/dependency-check
          rm dependency-check.zip

      # Cache de la base NVD para que no tenga que descargar todo cada vez
      - name: Cache Dependency-Check NVD Database
        uses: actions/cache@v3
        with:
          path: $HOME/.dependency-check
          key: dependency-check-nvd-db-${{ runner.os }}
          restore-keys: |
            dependency-check-nvd-db-${{ runner.os }}

      # Ejecuta el scan principal
      - name: Run Dependency Check Scan
        run: |
          mkdir -p reports
          # Lo corremos con failOnCVSS 4 para que falle si hay vulnerabilidades medias, altas o criticas
          # Quitamos --noupdate porque si es la primera vez necesitamos que cree la DB
          # --disableOssIndex evita errores de limite de OSS Index
          $HOME/dependency-check/dependency-check/bin/dependency-check.sh \
            --scan . \
            --format ALL \
            --project "DevSecOps-Final-IIDB" \
            --out reports \
            --failOnCVSS 4 \
            --disableOssIndex

      # Sube los reportes como artifact para poder verlos despues
      - name: Upload SCA reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: reports
# --------------------------
# Job 3: Build Docker + Scan con Trivy
# --------------------------
  docker-trivy:
    name: Build Docker image + Trivy scan
    runs-on: ubuntu-latest
    steps:
      # 1. Trae el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Construye la imagen Docker local
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: local-image:dev-${{ github.run_id }}

      # 3. Guarda el tag en variable de entorno para usarlo después
      - name: Save image tag
        run: echo "IMAGE_REF=local-image:dev-${{ github.run_id }}" >> $GITHUB_ENV

      # 4. Debug: mostrar el tag (opcional)
      - name: Debug: show image tag
        run: echo "IMAGE REF = $IMAGE_REF"

      # 5. Ejecuta Trivy scan
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.33.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scan-type: image
          format: table
          exit-code: 0              # 0 para que no falle el workflow
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: os,library
          output: trivy-report.txt

      # 6. Sube el reporte como artifact para revisarlo
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt



